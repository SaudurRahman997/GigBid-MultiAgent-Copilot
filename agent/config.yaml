# GigBid runtime configuration. Models, thresholds, budgets and switches live here, never in Python.
# Budget and threshold numbers are PLACEHOLDERS until replaced by declared targets (Phase 9/11).
marketplace: gigsim            # gigsim | upwork_live
profile: open                  # open | paid
profiles:
  open:
    small:  { provider: ollama, model: "qwen3:8b" }            # local
    strong: { provider: groq,   model: openai/gpt-oss-120b }   # deployed
    fallback_small: { provider: groq, model: openai/gpt-oss-20b }
  paid:
    small:  { provider: openai,    model: CHOOSE_BY_EVAL }
    strong: { provider: anthropic, model: CHOOSE_BY_EVAL }
nodes:                         # which model role each node uses
  scout: small
  job_analyst: small
  risk_assessor: small
  fit_matcher: small
  pricing: small
  writer: strong
  verifier: small
  critic: strong
  compliance: small
  liaison: strong
embeddings:                    # fastembed (ONNX, CPU); ADR 0005 explains the choice over BGE-M3
  model: nomic-ai/nomic-embed-text-v1.5
  dim: 768
  query_prefix: "search_query: "
  doc_prefix: "search_document: "
reranker: { model: BAAI/bge-reranker-v2-m3-int8 }   # int8 build of bge-reranker-v2-m3
rag:
  variant: bm25_baseline       # INTERIM (Phase 3). Phase 4 sets this from evals/results/, not by default
  k: 5
  index: memory                # memory | pgvector (same cosine search; pgvector in deployment)
  chunking: { fixed_words: 200, fixed_overlap: 40, max_words: 220 }
  candidates: 30               # per sub-query, before fusion / reranking
  rrf_k: 60
  outcome_boost:               # V4 multiplicative boosts by evidence outcome
    won: 1.30
    replied: 1.12
    ignored: 0.85
    rehired: 1.15
    high_rating: 1.05          # review >= 4.8
  crag:                        # V8 corrective loop
    max_rounds: 2
    min_rerank_score: 0.0      # grader threshold on reranker logit; calibrated on dev, see evals
    min_good_hits: 1
  cache_dir: var/cache/rag
loops:   { critic_max_rounds: 2 }
budgets:
  max_steps_per_thread: 40
  max_tokens_per_thread: 60000
  p95_latency_s: { job: 20, proposal: 60 }
  usd: { job: 0.002, proposal: 0.01 }
autonomy:   { auto_skip_below_fit: 0.25, auto_send: false }
scheduling: { gigsim_interval_min: 10, live_interval_min: 60 }
ci_thresholds: { max_unsupported_claims_per_proposal: 0.3, min_bid_skip_f1: 0.75 }
policy_version: v1
mcp:
  servers:                     # URL from env, default for local dev
    portfolio:   { url_env: MCP_PORTFOLIO_URL,   default: "http://localhost:8201/mcp" }
    marketplace: { url_env: MCP_MARKETPLACE_URL, default: "http://localhost:8202/mcp" }
    workspace:   { url_env: MCP_WORKSPACE_URL,   default: "http://localhost:8203/mcp" }
  timeout_s: 15
  retries: { max_attempts: 3, backoff_base_s: 0.5, backoff_max_s: 8 }
  transient_errors: [rate_limited, marketplace_unavailable, timeout, connection]
  pending_queue_path: var/pending_mcp_calls.jsonl   # degraded mode: queued writes, resumed later
  allowlists:                  # tools each agent role may call (by name); everything else is hidden
    scout:         [search_jobs, get_job]
    job_analyst:   [get_job]
    risk_assessor: [get_job, get_client_history]
    submitter_preview: [create_proposal_draft, get_connects_balance]
    fit_matcher:   [search_evidence, get_case_study, list_skills, get_profile]
    pricing:       [get_job, get_connects_balance, get_market_rates]
    writer:        [search_evidence, get_case_study]
    verifier:      [verify_claims, search_evidence]
    critic:        []
    compliance:    []
    submitter:     [create_proposal_draft, submit_proposal, get_connects_balance]
    liaison:       [list_messages, search_evidence, get_profile, verify_claims, send_message, free_slots, create_tentative_hold]
    single_agent:  [search_jobs, get_job, get_client_history, search_evidence, get_case_study, list_skills, create_proposal_draft]
verify:                        # claim verification (rag/verify.py)
  judge: rerank                # rerank (deterministic, default) | llm (verifier model)
  k: 5                         # evidence items retrieved per claim
  support_logit: 0.0           # cross-encoder logit >= this -> supported (calibrated vs human labels)
  partial_logit: -3.0          # >= this -> partial, below -> unsupported
  numbers_must_match: true     # a number absent from the evidence caps a claim at "partial"
  retrieval_variant: v2_hybrid # evidence retrieval for claims (cheap); revisit after R&D B
agents:
  modes:                       # llm | rules  (rules = deterministic fallback, used by tests/offline evals)
    job_analyst: llm
    risk_assessor: rules       # rules + regex injection detector; llm adds a classifier pass
    writer: llm
    critic: llm
    classify_intent: llm
    liaison: llm
  fallback_to_rules_on_llm_error: true
  node_retries: 2              # extra attempts per node on transient errors
  node_timeout_s: 90
decision:
  min_fit_to_bid: 0.6          # must-have weighted fit to recommend bidding
  watch_min_fit: 0.4           # between watch_min_fit and min_fit_to_bid -> watch
  min_client_score: 0.35       # below -> skip (poor client history)
  max_connects: 16
pricing:
  fixed_cap_over_budget: 1.10  # never quote more than 110% of a fixed budget
  hourly_target_weight: 0.5    # blend of persona target rate and market median
writer:
  max_words: 220
  min_evidence: 2
memory:
  style_min_drafts: 3          # an edit pattern becomes a style rule after >= 3 approved drafts
  style_max_phrase_words: 8
  outcome_terminal_events: [replied, interview, hired, lost]
