# Hand-written facts for the three SYNTHETIC freelancer personas. People, companies and projects
# are fictional. Generators expand these into portfolios (personas.py) and jobs (devset.py).
#
# Per archetype:
#   skills    canonical skills (names from data/processed/skill_taxonomy.json where possible)
#   implied   how portfolio text describes a skill WITHOUT naming it (hard for lexical search)
#   job_need  how a job post asks for the same capability (deliberately different wording)
#   metrics   result templates; {a},{b} are numbers, {p} a percentage
#   repo      optional public repo with README + small code sample

version: 1

industries:
  legal:         {noun: law firm, names: [Halden & Pryce LLP, Northgate Legal, Corbel Law Group]}
  healthcare:    {noun: clinic network, names: [Brightwater Clinics, Meridian Care, Pinecrest Health]}
  ecommerce:     {noun: online store, names: [Loomly Goods, Cedar & Salt, Parcelbox Shop]}
  logistics:     {noun: freight company, names: [Ridgeway Freight, Portline Logistics, Haulwise]}
  fintech:       {noun: lending startup, names: [Fernpay, Ledgerly, Quillfund]}
  real_estate:   {noun: property management firm, names: [Keystone Lettings, Oakrow Properties, Urbanest]}
  education:     {noun: online course platform, names: [Learnfield, Brightpath Academy, Skillcrate]}
  saas:          {noun: B2B SaaS company, names: [Tallyhq, Orbitdesk, Signalpad]}
  manufacturing: {noun: auto-parts manufacturer, names: [Velden Components, Ironbark Parts, Castwell]}
  hospitality:   {noun: boutique hotel group, names: [Saltmarsh Hotels, The Linden Collection, Harbourline Stays]}
  nonprofit:     {noun: nonprofit, names: [Open Harvest, Riverkeep Trust, Common Table]}
  marketing:     {noun: marketing agency, names: [Brightloop Media, Fathom & Co, Northstar Digital]}

# Alternative names a client might use (job side only).
synonyms:
  large language model: [LLM, GPT-style models, generative AI]
  langchain: [LangChain, LLM orchestration frameworks]
  openai api: [OpenAI, GPT-4 API]
  machine learning: [ML, predictive modelling]
  natural language processing: [NLP, text analytics]
  computer vision: [CV, image recognition]
  pytorch: [PyTorch, torch]
  scikit-learn: [sklearn, scikit learn]
  ai agent development: [AI agents, agentic workflows, tool-using LLM agents]
  chatbot development: [chatbot, conversational AI]
  hugging face: [Hugging Face transformers, HF models]
  fastapi: [FastAPI, async Python APIs]
  react: [React.js, ReactJS]
  next.js: [Next.js, NextJS]
  node.js: [Node, NodeJS]
  typescript: [TS, typed JavaScript]
  postgresql: [Postgres, PostgreSQL]
  rest api: [REST endpoints, RESTful services]
  api integration: [third-party API integration, connecting external services]
  docker: [containers, Docker]
  aws: [AWS, Amazon Web Services]
  microsoft power bi: [Power BI, PowerBI]
  microsoft excel: [Excel, spreadsheets]
  sql: [SQL, database queries]
  data visualization: [dashboards, data viz]
  statistics: [statistical analysis, hypothesis testing]
  etl: [data pipelines, ETL]
  google analytics: [GA4, Google Analytics]
  looker studio: [Looker Studio, Data Studio]
  tableau: [Tableau]
  data cleaning: [data wrangling, data cleanup]
  financial modeling: [financial models, forecasting models]

personas:
  ai_ml:
    name: Aiko Tanaka-Reyes
    headline: Applied ML engineer — LLM apps, NLP and computer vision that ship
    location: Lisbon, Portugal (remote)
    years_experience: 7
    category: ai_ml
    floors: {hourly: 30, fixed: 250}
    target_rate: 55
    base_skills: [python, machine learning, docker, git, sql]
    lacks: [ros, reinforcement learning, unity, salesforce, swift, autodesk maya, solidity, sap]
    archetypes:
      - key: rag_assistant
        title: Document Q&A assistant for a {noun}
        problem: staff at {client} spent hours digging through policy PDFs and past case files to answer routine questions
        approach:
          - built a retrieval pipeline that grounds every answer in the client's own documents, with citations back to the source page
          - chunked and embedded about {a} documents into Postgres with pgvector and added a re-ranking step
          - wrapped it in a small FastAPI service with a chat front end and an evaluation set of real questions
        skills: [large language model, langchain, openai api, python, postgresql, fastapi]
        implied:
          large language model: a retrieval pipeline that grounds answers in the client's own documents
          langchain: an orchestration layer that chains retrieval, re-ranking and generation
        job_need: a chatbot that answers questions from our internal PDFs and cites where the answer came from
        metrics: ["cut average lookup time from {a} minutes to under {b} seconds", "answered {p}% of internal questions without escalation"]
        deliverables: [ingestion pipeline, chat API, evaluation report]
        repo: {name: doc-qa-service, lang: python, kind: fastapi_rag}
      - key: churn_model
        title: Subscriber churn prediction for a {noun}
        problem: "{client} was losing subscribers and only noticed after they cancelled"
        approach:
          - built a gradient-boosted model scoring which customers were likely to leave in the next 30 days
          - engineered usage features from {a} months of event logs with SQL and pandas
          - delivered weekly risk lists the retention team could act on
        skills: [machine learning, scikit-learn, python, pandas, sql]
        implied:
          machine learning: a gradient-boosted model scoring which customers were likely to leave
          scikit-learn: a calibrated gradient-boosting classifier with cross-validated thresholds
        job_need: predict which of our customers are about to cancel so we can reach out first
        metrics: ["lifted 90-day retention by {p}%", "flagged {p}% of churners at least two weeks early"]
        deliverables: [trained model, feature pipeline, weekly risk report]
        repo: {name: churn-signals, lang: python, kind: sklearn_model}
      - key: invoice_extraction
        title: Invoice and receipt extraction for a {noun}
        problem: the finance team at {client} keyed in hundreds of scanned invoices by hand every week
        approach:
          - built a pipeline reading scanned invoices and pulling out totals, dates, vendors and line items
