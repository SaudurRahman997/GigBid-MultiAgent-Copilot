      - key: ticket_classifier
        title: Support ticket triage for a {noun}
        problem: "{client}'s support inbox mixed billing, bugs and sales questions, and urgent tickets waited for hours"
        approach:
          - trained a transformer classifier routing free-text tickets to the right queue
