        implied:
          ai agent development: an assistant that calls the calendar and CRM tools on its own
          openai api: function calling against a hosted GPT model
        job_need: an AI assistant that can use our calendar and CRM to book appointments, with a human check before sending
        metrics: ["saved coordinators about {a} hours a week", "booked {p}% of meetings with no manual edits"]
        deliverables: [agent service, tool connectors, audit log]
        repo: {name: calendar-agent, lang: python, kind: tool_agent}
      - key: recommender
        title: Product recommendations for an {noun}
        problem: "{client}'s product pages showed the same bestsellers to everyone"
        approach:
          - built a model suggesting products based on what similar shoppers bought and viewed
          - trained on {a} months of orders and served results from a nightly batch job
          - ran an A/B test against the old bestseller block
        skills: [machine learning, python, pandas, postgresql]
        implied:
          machine learning: suggesting products based on what similar shoppers bought
        job_need: show each visitor products they are likely to buy based on their browsing
        metrics: ["raised average order value by {p}%", "increased click-through on recommendations by {p}%"]
        deliverables: [recommendation model, batch job, A/B test readout]
      - key: forecasting
        title: Demand forecasting for a {noun}
        problem: "{client} kept over-ordering slow items and running out of popular ones"
        approach:
          - built a model predicting next month's orders per warehouse and product line
