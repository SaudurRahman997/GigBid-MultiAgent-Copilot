        deliverables: [detection model, edge deployment, labelling set]
        repo: {name: line-inspector, lang: python, kind: vision_model}
      - key: llm_finetune
        title: House-style writing model for a {noun}
        problem: "{client}'s team rewrote every AI draft because it never sounded like them"
        approach:
          - adapted an open-weight model to write in the firm's house style using {a} approved examples
          - built prompt templates and an evaluation rubric with the editors
          - served it on a single GPU with batching
        skills: [large language model, hugging face, pytorch, prompt engineering]
        implied:
          large language model: adapting an open-weight model to write in the firm's house style
          prompt engineering: prompt templates and an evaluation rubric agreed with the editors
        job_need: fine-tune an AI model so its drafts match our brand voice
        metrics: ["cut editing time per draft by {p}%", "editors accepted {p}% of drafts with light edits"]
        deliverables: [fine-tuned model, prompt library, evaluation rubric]
      - key: support_chatbot
        title: Website support assistant for a {noun}
        problem: "{client} could not answer customer questions outside office hours"
        approach:
          - built a website assistant that answers customer questions around the clock from the help centre
