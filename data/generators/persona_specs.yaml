        skills: [machine learning, python, pandas, statistics]
        implied:
          machine learning: predicting next month's orders per warehouse
          statistics: prediction intervals so planners could see the uncertainty
        job_need: forecast how much stock we need each month so we stop running out
        metrics: ["cut forecast error by {p}%", "reduced stockouts by {p}%"]
        deliverables: [forecasting model, weekly export, backtest report]
      - key: defect_detection
        title: Visual defect detection for an {noun}
        problem: inspectors at {client} missed small scratches on parts during busy shifts
        approach:
          - trained a model spotting scratches and dents in production-line camera images
