# Machine-readable GigBid policy pack (mirrors policy.md). Read by the Compliance node,
# the output filter and the generators. Edit here, never in Python.
version: v2
synthetic: true
provenance: hand-written@policy-pack-v2

rules:
  - id: no_off_platform_contact
    severity: block
    description: Never share or ask for contact details or move the conversation off-platform.
    patterns:
      email: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
      phone: '(?<!\d)(?:\+?\d[\s().-]?){9,14}\d(?!\d)'
      messenger: '(?i)\b(whats\s?app|telegram|signal app|skype|wechat|discord|viber)\b'
  - id: no_off_platform_payment
    severity: block
    description: Never accept or propose payment outside the platform (bank transfer, crypto, gift cards, PayPal).
    patterns:
      payment: '(?i)\b(paypal|western union|wire transfer|bank transfer|gift ?cards?|bitcoin|btc|usdt|crypto(currency)?|zelle|cash ?app)\b'
  - id: no_fabricated_experience
    severity: block
    description: Every claim about experience, results or clients must be supported by portfolio evidence.
  - id: no_guarantees
    severity: block
    description: No guarantees of outcomes (rankings, revenue, 100% accuracy, approval).
    patterns:
      guarantee: '(?i)\b(guarantee[ds]?|100\s?% (accurate|accuracy|success)|risk[- ]free|promise you (will|\d))'
  - id: no_external_links
    severity: block           # platform policy v2: proposals may not include external links
    description: Avoid links to external sites in proposals; describe work instead.
    patterns:
      link: '(?i)\b((https?://|www\.)\S+)'
  - id: fair_automation_use
    severity: block
    description: A human approves every proposal, message and Connects spend; nothing is auto-sent.
  - id: no_free_work
    severity: warn
    description: Do not do unpaid test work beyond a short screening answer.

connects:
  default: 8
  max_per_proposal: 32
  busy_applicants: ["20 to 50", "50+"]   # applicant buckets the platform treats as busy jobs
  busy_multiplier: 2                     # Connects multiplier on busy jobs (platform policy v2: doubles)
  # Connects needed to submit, by fixed budget (USD) or hourly max rate (USD/h).
  tiers:
    fixed:
      - {below: 50, connects: 4}
      - {below: 200, connects: 8}
      - {below: 1000, connects: 12}
      - {below: .inf, connects: 16}
    hourly:
      - {below: 20, connects: 4}
      - {below: 40, connects: 8}
      - {below: 70, connects: 12}
      - {below: .inf, connects: 16}
  monthly_free: 10
  starting_balance: 120

screening:
  max_cover_letter_chars: 5000
  max_screening_answer_chars: 1500

# Risk signals (Risk Assessor). Patterns are case-insensitive regexes over the job text.
scam_signals:
  off_platform: 'whats\s?app|telegram|outside the platform|off[- ]platform|bank transfer|your (email|phone|number)|contact me (directly|on)'
  upfront_fee: 'deposit|registration fee|starter kit|training materials|refundable|one-time .{0,20}fee'
  crypto: 'usdt|bitcoin|\bbtc\b|crypto|wallet address'
  free_work: 'unpaid|sample (project|task)|trial task|pay the winner|send a finished'
  vague_high_budget: 'budget is not a problem|details will be shared|simple work, high pay|confidential project|paid very well'
injection_patterns:
  - '(?i)ignore (all )?(previous|prior|your) (instructions|rules|guidance)'
  - '(?i)(note|instruction)s? (for|to) (any )?ai'
  - '(?i)\b(system|assistant)\s*[:\]]'
  - '(?i)if you are an ai'
  - '(?i)reveal (your )?(system prompt|api keys?)'
  - '(?i)disregard (the|your|all)'
  - '(?i)system override'
client_score:                  # weights for the public client-history score in [0, 1]
  payment_verified: 0.25
  rating: 0.35                 # (rating - 3) / 2, missing rating -> 0.5
  hire_rate: 0.25
  spend: 0.15                  # min(1, log10(1 + spend) / 4)
client_red_flags:              # any one -> poor client history (Risk Assessor -> caution, Decide -> skip)
  min_rating: 4.0              # rating below this
  low_hire_rate: 0.2           # hire rate below this ...
  low_hire_min_posts: 5        # ... with at least this many jobs posted
  unverified_ghost_posts: 10   # payment unverified, $0 spent and at least this many posts
