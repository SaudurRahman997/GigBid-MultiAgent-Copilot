[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: multi-agent freelancer copilot (AI-4016 R&D Assignment II)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.0",
    "fastembed==0.9.1",
    "fpdf2==2.9.0",
    "httpx==0.28.1",
    "kaggle==2.2.5",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.2",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "mcp==1.30.0",
    "pandas==3.1.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.1",
    "pydantic-settings==2.16.3",
    "pypdf==7.1.0",
    "python-calamine==0.9.1",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "scikit-learn==1.9.1",
    "six==1.17.0",
    "sqlalchemy==2.1.8",
    "tabulate==0.10.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "data/raw", "data/personas"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["apps/web/", "data/raw/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: needs docker compose services running"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.ruff.lint.per-file-ignores]
# Generators hold long template sentences and data tables; wrapping them hurts readability.
"data/generators/*" = ["E501"]
"tests/unit/test_generators.py" = ["E501"]
"tests/unit/test_rag.py" = ["E501"]  # fixture texts
"scripts/gen_tools_doc.py" = ["E501"]  # markdown table rows inside the doc template
"evals/runners/*" = ["E501"]  # report/table formatting strings
# Graph nodes/routers keep state dicts and MCP calls on one line (marked `# fmt: skip`).
"agent/**/*.py" = ["E501"]
"evals/inprocess_mcp.py" = ["E501"]
"tests/unit/test_graphs.py" = ["E501"]
"mcp_servers/portfolio/server.py" = ["E501"]
