[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: multi-agent freelancer copilot (AI-4016 R&D Assignment II)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaggle==2.2.5",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "python-calamine==0.9.1",
    "pyyaml==6.0.3",
    "six==1.17.0",
    "tabulate==0.10.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "data/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["apps/web/", "data/raw/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: needs docker compose services running"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]
